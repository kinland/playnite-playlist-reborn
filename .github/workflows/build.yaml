on:
  release:
    types: [published]

name: Build and Upload Release Asset

jobs:
  build:
    name: Build and Upload Release Asset
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Validate tag matches extension.yaml version
        shell: pwsh
        run: |
          $tag = ($env:GITHUB_REF -Split "/")[-1]
          $tagVersion = $tag -replace '^v', ''
          $manifestVersion = (Select-String -Path "extension.yaml" -Pattern '^\s*Version:\s*(.+?)\s*$').Matches[0].Groups[1].Value.Trim()
          if (-not $manifestVersion) {
            throw "Unable to read Version from extension.yaml"
          }
          if ($tagVersion -ne $manifestVersion) {
            throw "Release tag version ($tag) does not match extension.yaml Version ($manifestVersion)"
          }

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.3
        
      - name: Setup NuGet.exe
        uses: nuget/setup-nuget@v1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Restore NuGet Packages
        run: nuget restore Playlist.sln
  
      - name: Build and Publish
        run: |
          msbuild Playlist.sln /p:Configuration=Release
          $tag = ($env:GITHUB_REF -Split "/")[-1]
          $version = $tag -replace '^v', ''
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Unit Tests
        run: dotnet test tests/Playlist.UnitTests/Playlist.UnitTests.csproj -c Release --nologo

      - name: Run UI Tests
        run: dotnet test tests/Playlist.UiTests/Playlist.UiTests.csproj -c Release --nologo

      - name: Version Output Asset
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          $src = "bin/Playlist.pext"
          $dst = "bin/Playlist-$version.pext"
          if (!(Test-Path $src)) {
            throw "Expected output asset not found: $src"
          }
          Move-Item -Path $src -Destination $dst -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: bin/Playlist-${{ env.RELEASE_TAG }}.pext
