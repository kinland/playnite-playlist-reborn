on:
  release:
    types: [published]

name: Build and Upload Release Asset

jobs:
  build:
    name: Build and Upload Release Asset
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.3
        
      - name: Setup NuGet.exe
        uses: nuget/setup-nuget@v1
      
      - name: Restore NuGet Packages
        run: nuget restore Playlist.sln
  
      - name: Build and Publish
        run: |
          msbuild Playlist.sln /p:Configuration=Release
          $version = ($env:GITHUB_REF -Split "/")[-1]
          echo "VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Version Output Asset
        shell: pwsh
        run: |
          $version = $env:VERSION
          $src = "bin/Playlist.pext"
          $dst = "bin/Playlist-$version.pext"
          if (!(Test-Path $src)) {
            throw "Expected output asset not found: $src"
          }
          Move-Item -Path $src -Destination $dst -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: bin/Playlist-${{ env.VERSION }}.pext
